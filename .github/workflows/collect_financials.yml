name: 재무 정보 수집

on:
  schedule:
    - cron: '0 1 * * 1'   # 매주 월요일 10:00 KST (= 01:00 UTC)
  workflow_dispatch:         # 수동 실행

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: stock-collector/requirements.txt

      - name: 의존성 설치
        run: pip install -r stock-collector/requirements.txt

      - name: 재무 정보 수집
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python stock-collector/collect_financials.py
