name: Supabase 마이그레이션 적용

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:   # 수동 실행 버튼

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Supabase CLI 설치
        uses: supabase/setup-cli@v1
        with:
          version: 3.2.0

      - name: 마이그레이션 적용
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "Missing required secret: SUPABASE_ACCESS_TOKEN" && exit 1)

          PROJECT_REF="$SUPABASE_PROJECT_REF"
          if [ -z "$PROJECT_REF" ] && [ -n "$SUPABASE_URL" ]; then
            PROJECT_REF="${SUPABASE_URL#https://}"
            PROJECT_REF="${PROJECT_REF#http://}"
            PROJECT_REF="${PROJECT_REF%%.*}"
          fi

          test -n "$PROJECT_REF" || (echo "Missing required secret: SUPABASE_PROJECT_REF or SUPABASE_URL" && exit 1)

          supabase link --project-ref "$PROJECT_REF"
          # --yes: CI 는 터미널이 아니라 확인 질문에 답할 수 없다. 없으면 적용할 것이 있을 때 실패한다.
          supabase db push --remote --yes
