name: 일봉 데이터 수집

on:
  schedule:
    - cron: '10 11 * * 1-5'  # 평일 20:10 KST (= 11:10 UTC)
  workflow_dispatch:           # 수동 실행 버튼

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: stock-collector/requirements.txt

      - name: 의존성 설치
        run: pip install -r stock-collector/requirements.txt

      - name: 일봉 수집
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python stock-collector/collect_candles.py
