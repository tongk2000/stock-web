name: 공매도 잔고 수집

on:
  schedule:
    - cron: '10 9 * * 1-5'   # 18:10 KST — 1차 수집 (daily)
    - cron: '0 11 * * 1-5'   # 20:00 KST — 누락분 재수집 (retry)
  workflow_dispatch:
    inputs:
      mode:
        description: 수집 모드
        type: choice
        options: [daily, retry, backfill]
        default: daily

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: stock-collector/requirements.txt

      - name: 의존성 설치
        run: pip install -r stock-collector/requirements.txt

      - name: 수집 모드 결정
        id: m
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "10 9 * * 1-5" ]; then
            echo "mode=daily" >> "$GITHUB_OUTPUT"
          else
            echo "mode=retry" >> "$GITHUB_OUTPUT"
          fi

      - name: 공매도 잔고 수집
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python stock-collector/collect_short_balances.py --mode ${{ steps.m.outputs.mode }}
