name: 공매도·신용잔고 수집 (KIS)

on:
  schedule:
    - cron: '30 9 * * 1-5'   # 평일 18:30 KST (= 09:30 UTC)
  workflow_dispatch:
    inputs:
      mode:
        description: 수집 모드
        type: choice
        options: [daily, backfill]
        default: daily

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: stock-collector/requirements.txt

      - name: 의존성 설치
        run: pip install -r stock-collector/requirements.txt

      - name: 공매도·신용잔고 수집
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: python stock-collector/collect_kis_flows.py --mode ${{ inputs.mode || 'daily' }}
